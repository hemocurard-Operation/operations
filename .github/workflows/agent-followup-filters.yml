name: Agent followup filters
on:
  pull_request:
    paths: ['hemocura-core/agent-followup-status.js', 'hemocura-core/improvement-agents.js', 'hemocura-core/access-control.js', 'css/improvement-agents.css', 'tests/agent-followup-filters/**', 'tools/agent_followup_filters_browser_runner.cjs', '.github/workflows/agent-followup-filters.yml']
  push:
    branches: [main]
    paths: ['hemocura-core/agent-followup-status.js', 'hemocura-core/improvement-agents.js', 'hemocura-core/access-control.js', 'css/improvement-agents.css', 'tests/agent-followup-filters/**', 'tools/agent_followup_filters_browser_runner.cjs', '.github/workflows/agent-followup-filters.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/agent-followup-filters/domain.test.mjs
      - run: npm ci --prefix tests/wave50 --ignore-scripts --no-audit --no-fund
      - run: node tests/wave50/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - run: node tools/agent_followup_filters_browser_runner.cjs
        env:
          HEMOCURA_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-followup-filters-${{ matrix.engine }}
          path: /tmp/hemocura-agent-followup-filters
