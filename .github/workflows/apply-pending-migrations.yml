name: Pending Supabase migration plan (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Show reviewed pending files and checksums
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          version=json.loads(pathlib.Path('VERSION.json').read_text())
          lines=['## Pending operational migrations','Deployment uses the connected Supabase migration tool and its canonical migration history.']
          for name in version.get('pending_supabase_migrations',[]):
              path=pathlib.Path('supabase/migrations')/(name+'.sql')
              if not path.is_file(): raise SystemExit('Missing migration: '+str(path))
              lines.append('- '+str(path)+' SHA256 '+hashlib.sha256(path.read_bytes()).hexdigest())
          lines.append('Financial drafts under supabase/deferred are excluded from deployment.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report: report.write('\n'.join(lines)+'\n')
          PY
