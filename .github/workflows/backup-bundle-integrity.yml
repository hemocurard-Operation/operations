name: Backup bundle integrity
on:
  pull_request:
    paths:
      - 'tools/backup_hemocura.sh'
      - 'tools/verify_backup_bundle.py'
      - 'tools/test_verify_backup_bundle.py'
      - '.github/workflows/backup-bundle-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/backup_hemocura.sh'
      - 'tools/verify_backup_bundle.py'
      - 'tools/test_verify_backup_bundle.py'
      - '.github/workflows/backup-bundle-integrity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools -p test_verify_backup_bundle.py -v
      - run: bash -n tools/backup_hemocura.sh
