name: Blood unit traceability

on:
  pull_request:
    paths:
      - 'sql/22_OPERATIONS_QMS_COMPLIANCE_v0_22.sql'
      - 'sql/23_BLOOD_OPERATIONS_BI_PM_v0_23.sql'
      - 'supabase/migrations/20261013183215_donor_management.sql'
      - 'tests/blood-traceability/**'
      - 'tests/donors/database-bootstrap.sql'
      - 'tools/blood_traceability_runner.py'
      - '.github/workflows/blood-traceability.yml'
  push:
    branches: [main]
    paths:
      - 'sql/22_OPERATIONS_QMS_COMPLIANCE_v0_22.sql'
      - 'sql/23_BLOOD_OPERATIONS_BI_PM_v0_23.sql'
      - 'supabase/migrations/20261013183215_donor_management.sql'
      - 'tests/blood-traceability/**'
      - 'tests/donors/database-bootstrap.sql'
      - 'tools/blood_traceability_runner.py'
      - '.github/workflows/blood-traceability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run blood traceability on disposable PostgreSQL
        run: python3 tools/blood_traceability_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blood-traceability-report
          path: /tmp/hemocura-blood-traceability
