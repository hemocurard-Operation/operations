name: Cleaning module (equipment hygiene)

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261113120000_cleaning_module.sql'
      - 'sql/35_RESOURCES_CONTROL_v0_35.sql'
      - 'sql/39_COLD_CHAIN_v0_39.sql'
      - 'supabase/migrations/20261017084848_lab_management_workspace.sql'
      - 'tests/cleaning/**'
      - 'tools/cleaning_module_runner.py'
      - '.github/workflows/cleaning-module.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261113120000_cleaning_module.sql'
      - 'sql/35_RESOURCES_CONTROL_v0_35.sql'
      - 'sql/39_COLD_CHAIN_v0_39.sql'
      - 'supabase/migrations/20261017084848_lab_management_workspace.sql'
      - 'tests/cleaning/**'
      - 'tools/cleaning_module_runner.py'
      - '.github/workflows/cleaning-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleaning-module:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run cleaning module tests on disposable PostgreSQL
        run: python3 tools/cleaning_module_runner.py
      - name: Lint migration
        run: python3 tools/migration_security_linter.py supabase/migrations/20261113120000_cleaning_module.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaning-module-report
          path: /tmp/hemocura-cleaning-module
