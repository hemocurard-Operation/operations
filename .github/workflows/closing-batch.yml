name: Closing batch (L3+CM1+BI2+BI4)

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261114120000_closing_batch.sql'
      - 'tests/closing-batch/**'
      - 'tools/closing_batch_runner.py'
      - '.github/workflows/closing-batch.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261114120000_closing_batch.sql'
      - 'tests/closing-batch/**'
      - 'tools/closing_batch_runner.py'
      - '.github/workflows/closing-batch.yml'
  workflow_dispatch:

permissions: {contents: read}
jobs:
  closing-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/closing_batch_runner.py
      - run: python3 tools/migration_security_linter.py supabase/migrations/20261114120000_closing_batch.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: closing-batch-report, path: /tmp/hemocura-closing-batch}
