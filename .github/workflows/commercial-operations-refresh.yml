name: Weekly commercial goals and fixed trip incentives
on:
  pull_request:
    paths:
      - 'hemocura-core/**'
      - 'css/commercial-goals.css'
      - 'css/commercial-workspace.css'
      - 'css/extra-trips.css'
      - 'supabase/migrations/*commercial_goals_units.sql'
      - 'supabase/migrations/*logistics_fixed_incentives.sql'
      - 'supabase/migrations/*logistics_outside_hours_default.sql'
      - 'tests/commercial-goals/**'
      - 'tests/commercial-ux/weekly.test.mjs'
      - 'tests/operational-reports/**'
      - 'tests/logistics-fixed/**'
      - 'tools/commercial_goals_browser_runner.cjs'
      - 'tools/commercial_weekly_browser_runner.cjs'
      - '.github/workflows/commercial-operations-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'hemocura-core/commercial*.js'
      - 'hemocura-core/extra-trips*.js'
      - 'supabase/migrations/*commercial_goals_units.sql'
      - 'supabase/migrations/*logistics_fixed_incentives.sql'
      - 'supabase/migrations/*logistics_outside_hours_default.sql'
      - '.github/workflows/commercial-operations-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/commercial-goals/domain.test.mjs
      - run: node tests/commercial-ux/weekly.test.mjs
      - run: node tests/operational-reports/domain.test.mjs
      - run: node tests/logistics-trips/domain.test.mjs
      - run: python tools/javascript_syntax_gate.py
      - run: python tools/audit_ui_routes.py
      - run: python tools/migration_security_linter.py supabase/migrations/*commercial_goals_units.sql supabase/migrations/*logistics_fixed_incentives.sql supabase/migrations/*logistics_outside_hours_default.sql
      - run: python tools/workflow_postgres_runner.py --allow-external-prerequisite-fixture --report-dir /tmp/commercial-operations-postgres
      - run: npm ci --prefix tests/wave50 --ignore-scripts --no-audit --no-fund
      - run: node tests/wave50/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser integration
        shell: bash
        run: |
          HEMOCURA_BROWSER="$(node -p "require('./tests/wave50/node_modules/playwright').chromium.executablePath()")"
          export HEMOCURA_BROWSER
          node tools/commercial_goals_browser_runner.cjs
          node tools/commercial_weekly_browser_runner.cjs
          node tools/trips_browser_runner.cjs
          node tools/logistics_roles_browser_runner.cjs
          node tools/operations_modules_browser_runner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-goals-monthly-trips
          path: |
            /tmp/commercial-operations-postgres
            /tmp/hemocura-commercial-goals
            /tmp/hemocura-commercial-weekly
            /tmp/hemocura-trips-browser
            /tmp/hemocura-logistics-roles-browser
            /tmp/hemocura-operations-modules
