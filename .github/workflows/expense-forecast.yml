name: Expense forecast (BI3)

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261114140000_expense_forecast.sql'
      - 'tests/expense-forecast/**'
      - 'tools/expense_forecast_runner.py'
      - '.github/workflows/expense-forecast.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261114140000_expense_forecast.sql'
      - 'tests/expense-forecast/**'
      - 'tools/expense_forecast_runner.py'
      - '.github/workflows/expense-forecast.yml'
  workflow_dispatch:

permissions: {contents: read}
jobs:
  expense-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/expense_forecast_runner.py
      - run: python3 tools/migration_security_linter.py supabase/migrations/20261114140000_expense_forecast.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: expense-forecast-report, path: /tmp/hemocura-expense-forecast}
