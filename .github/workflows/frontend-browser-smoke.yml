name: HemoCura Frontend Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'deployment-check.html'
      - 'VERSION.json'
      - 'js/**'
      - 'css/**'
      - 'hemocura-core/**'
      - 'tests/frontend-c11-2-smoke.html'
      - '.github/workflows/frontend-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Chromium/Chrome
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo 'No Chromium/Chrome browser found on runner.' >&2
            exit 1
          fi
          echo "path=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/hemocura-http.log 2>&1 &
          echo $! > /tmp/hemocura-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/VERSION.json >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/hemocura-http.log || true
          exit 1

      - name: C11.2 browser smoke
        shell: bash
        run: |
          set -euo pipefail
          BROWSER='${{ steps.browser.outputs.path }}'
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 \
            --dump-dom http://127.0.0.1:8000/tests/frontend-c11-2-smoke.html > /tmp/c11-smoke.html
          cat /tmp/c11-smoke.html
          grep -F 'PASS · rutas, vistas, mounts y VERSION coherentes' /tmp/c11-smoke.html

      - name: Deployment readiness browser smoke
        shell: bash
        run: |
          set -euo pipefail
          BROWSER='${{ steps.browser.outputs.path }}'
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 \
            --dump-dom http://127.0.0.1:8000/deployment-check.html > /tmp/deployment-check.html
          cat /tmp/deployment-check.html
          grep -F 'DEPLOYMENT READY' /tmp/deployment-check.html

      - name: Upload diagnostic HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hemocura-frontend-browser-smoke
          path: |
            /tmp/c11-smoke.html
            /tmp/deployment-check.html
            /tmp/hemocura-http.log
          if-no-files-found: ignore
