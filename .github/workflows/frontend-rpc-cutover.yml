name: HemoCura Frontend RPC Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'hemocura-core/**'
      - 'js/**'
      - 'contracts/**'
      - 'tools/frontend_rpc_cutover_gate.py'
      - '.github/workflows/frontend-rpc-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-rpc-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce controlled RPC wrappers
        run: python tools/frontend_rpc_cutover_gate.py
      - name: Runtime contract declaration
        run: python tools/runtime_contract_gate.py check-code contracts/runtime-contract-v0.45.json
