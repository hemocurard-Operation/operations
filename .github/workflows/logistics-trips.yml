name: Logistics mobile trips and incentives
on:
  pull_request:
    paths:
      - 'hemocura-core/extra-trips*.js'
      - 'hemocura-core/data-pages.js'
      - 'hemocura-core/my-work.js'
      - 'hemocura-core/documents.js'
      - 'hemocura-core/router.js'
      - 'hemocura-core/views.js'
      - 'hemocura-core/access-control.js'
      - 'hemocura-core/workflow-mounts.js'
      - 'css/extra-trips.css'
      - 'supabase/migrations/*logistics_extra_trips.sql'
      - 'tests/logistics-trips/**'
      - 'tools/trips_browser*'
      - '.github/workflows/logistics-trips.yml'
  push:
    branches: [main]
    paths:
      - 'hemocura-core/extra-trips*.js'
      - 'hemocura-core/data-pages.js'
      - 'hemocura-core/my-work.js'
      - 'hemocura-core/documents.js'
      - 'hemocura-core/router.js'
      - 'hemocura-core/views.js'
      - 'hemocura-core/access-control.js'
      - 'hemocura-core/workflow-mounts.js'
      - 'css/extra-trips.css'
      - 'supabase/migrations/*logistics_extra_trips.sql'
      - 'tests/logistics-trips/**'
      - 'tools/trips_browser*'
      - '.github/workflows/logistics-trips.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/logistics-trips/domain.test.mjs
      - run: python tools/migration_security_linter.py supabase/migrations/*logistics_extra_trips.sql
      - run: python tools/workflow_postgres_runner.py --allow-external-prerequisite-fixture --report-dir /tmp/hemocura-trips-postgres
      - run: npm ci --prefix tests/wave50 --ignore-scripts --no-audit --no-fund
      - run: node tests/wave50/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tools/trips_browser_runner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logistics-trips-evidence
          path: |
            /tmp/hemocura-trips-postgres
            /tmp/hemocura-trips-browser
