name: HemoCura Migration Security Linter

on:
  pull_request:
    paths:
      - 'sql/migrations/**/*.sql'
      - 'tools/migration_security_linter.py'
      - 'tools/test_migration_security_linter.py'
      - '.github/workflows/migration-security-linter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-security-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest tools/test_migration_security_linter.py -v

      - name: Lint governed migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'sql/migrations/**/*.sql' 'sql/migrations/*.sql')
          else
            mapfile -t FILES < <(find sql/migrations -type f -name '*.sql' -print 2>/dev/null || true)
          fi

          if (( ${#FILES[@]} == 0 )); then
            echo 'HC-LINT PASS: no governed migrations to lint.'
            exit 0
          fi

          python tools/migration_security_linter.py "${FILES[@]}" --json-out migration-security-lint.json
