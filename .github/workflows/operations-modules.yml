name: Seven Operations modules and inventory UX
on:
  pull_request:
    paths:
      - 'hemocura-core/operations-modules.js'
      - 'hemocura-core/operations-overview.js'
      - 'hemocura-core/operations-shell.js'
      - 'hemocura-core/inventory-view-domain.js'
      - 'hemocura-core/inventory-capture*.js'
      - 'hemocura-core/blood-operations-data.js'
      - 'tests/inventory-capture/**'
      - 'hemocura-core/blood-inventory.js'
      - 'hemocura-core/layout.js'
      - 'hemocura-core/my-work.js'
      - 'hemocura-core/ops-dashboard.js'
      - 'css/operations-shell.css'
      - 'tests/operations-modules/**'
      - 'tools/operations_modules_browser_runner.cjs'
      - '.github/workflows/operations-modules.yml'
  push:
    branches: [main]
    paths:
      - 'hemocura-core/operations-modules.js'
      - 'hemocura-core/operations-overview.js'
      - 'hemocura-core/operations-shell.js'
      - 'hemocura-core/inventory-view-domain.js'
      - 'hemocura-core/inventory-capture*.js'
      - 'hemocura-core/blood-operations-data.js'
      - 'tests/inventory-capture/**'
      - 'hemocura-core/blood-inventory.js'
      - 'hemocura-core/layout.js'
      - 'css/operations-shell.css'
      - 'tests/operations-modules/**'
      - 'tools/operations_modules_browser_runner.cjs'
      - '.github/workflows/operations-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/operations-modules/domain.test.mjs
      - run: node tests/inventory-capture/domain.test.mjs
      - run: python tools/javascript_syntax_gate.py
      - run: python tools/ux_budget_gate.py contracts/ux-budget-v0.45.7.json
      - run: npm ci --prefix tests/wave50 --ignore-scripts --no-audit --no-fund
      - run: node tests/wave50/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify actual navigation and inventory with synthetic records
        shell: bash
        run: |
          HEMOCURA_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export HEMOCURA_BROWSER
          node tools/operations_modules_browser_runner.cjs
          node tools/module_views_browser_runner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-operations-modules
          path: |
            /tmp/hemocura-operations-modules
            /tmp/hemocura-module-views-browser
