name: HemoCura Quick Capture Safety

on:
  pull_request:
    paths:
      - 'hemocura-core/quick-capture.js'
      - 'hemocura-core/quick-capture-data.js'
      - 'VERSION.json'
      - 'tools/test_quick_capture_safety.py'
      - '.github/workflows/quick-capture-safety.yml'
  push:
    branches: [main]
    paths:
      - 'hemocura-core/quick-capture.js'
      - 'hemocura-core/quick-capture-data.js'
      - 'VERSION.json'
      - 'tools/test_quick_capture_safety.py'
      - '.github/workflows/quick-capture-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit and safe form defaults
        run: python tools/test_quick_capture_safety.py
