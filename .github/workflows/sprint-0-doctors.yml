name: Sprint 0 — Security + Preflight doctors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

permissions:
  contents: write

jobs:
  doctors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client jq

      - name: Resolve working pooler DSN (auto-discovery IPv4)
        id: pooler
        env:
          DSN: ${{ secrets.SUPABASE_AUDIT_DSN }}
        run: |
          set -e
          if [ -z "$DSN" ]; then
            echo "::error::SUPABASE_AUDIT_DSN secret is not set."
            exit 1
          fi
          # Extrae user, password y project ref del DSN directo.
          # Formato esperado: postgresql://USER:PASS@db.REF.supabase.co:5432/postgres?...
          CREDS="${DSN#postgresql://}"
          USERPASS="${CREDS%%@*}"
          HOSTPART="${CREDS#*@}"
          USER="${USERPASS%%:*}"
          PASS="${USERPASS#*:}"
          HOST="${HOSTPART%%:*}"
          # REF = segunda parte del host db.REF.supabase.co
          REF=$(echo "$HOST" | awk -F. '{print $2}')
          echo "Project ref detectado: $REF"
          echo "Usuario: $USER"
          POOLER_USER="${USER}.${REF}"
          REGIONS="us-east-2 us-east-1 us-west-1 eu-west-1 eu-west-2 ap-southeast-1 ap-northeast-1 sa-east-1"
          FOUND=""
          for REGION in $REGIONS; do
            POOLER_HOST="aws-0-${REGION}.pooler.supabase.com"
            CANDIDATE="postgresql://${POOLER_USER}:${PASS}@${POOLER_HOST}:5432/postgres?sslmode=require"
            echo "Probing region ${REGION}..."
            if timeout 6 psql "$CANDIDATE" -At -c "select 1;" >/dev/null 2>&1; then
              echo "::notice::Pooler reachable in region ${REGION} (host ${POOLER_HOST})"
              FOUND="$CANDIDATE"
              echo "region=${REGION}" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No se encontró un pooler accesible en las regiones probadas."
            echo "Prueba manual: ve a Supabase → Settings → Database → Connection pooling y copia el host."
            exit 1
          fi
          # Guardamos el DSN resuelto como output enmascarado en vez de env global.
          echo "::add-mask::$FOUND"
          echo "resolved_dsn<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FOUND" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          # Prueba concreta: identidad + permisos del rol
          psql "$FOUND" -At -c "select current_user, current_database();"

      - name: Run C11_91 Security Doctor
        env:
          DSN: ${{ steps.pooler.outputs.resolved_dsn }}
        run: |
          mkdir -p docs/sprint-0
          STAMP=$(date -u +%Y-%m-%d)
          OUT="docs/sprint-0/C11_91_doctor_${STAMP}.json"
          echo "Running sql/C11_91_SECURITY_DOCTOR_READONLY.sql against production..."
          psql "$DSN" -At -F $'\t' -f sql/C11_91_SECURITY_DOCTOR_READONLY.sql \
            | jq -R -s 'split("\n") | map(select(length>0) | split("\t")) | map({control: .[0], detail: (.[1] // "null" | try fromjson catch .)})' \
            > "$OUT" || {
              echo "::warning::C11_91 execution failed; capturing raw error"
              psql "$DSN" -f sql/C11_91_SECURITY_DOCTOR_READONLY.sql > "$OUT" 2>&1 || true
            }
          echo "Wrote $OUT:"
          head -c 2000 "$OUT"
          echo

      - name: Run C12_00 Preflight Security Hardening
        env:
          DSN: ${{ steps.pooler.outputs.resolved_dsn }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          OUT="docs/sprint-0/C12_00_preflight_${STAMP}.json"
          echo "Running sql/C12_00_PREFLIGHT_SECURITY_HARDENING.sql against production..."
          psql "$DSN" -At -t -f sql/C12_00_PREFLIGHT_SECURITY_HARDENING.sql \
            | jq '.' > "$OUT" || {
              echo "::warning::C12_00 execution failed; capturing raw error"
              psql "$DSN" -f sql/C12_00_PREFLIGHT_SECURITY_HARDENING.sql > "$OUT" 2>&1 || true
            }
          echo "Wrote $OUT:"
          head -c 2000 "$OUT"
          echo

      - name: Verify read-only (confirm write is denied)
        env:
          DSN: ${{ steps.pooler.outputs.resolved_dsn }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          OUT="docs/sprint-0/read_only_proof_${STAMP}.txt"
          {
            echo "# Read-only proof"
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Pooler region: ${{ steps.pooler.outputs.region }}"
            echo
            if psql "$DSN" -c "update public.branches set name='HACK' where false;" 2>&1 | grep -q "permission denied"; then
              echo "✅ UPDATE rechazado con permission denied."
            else
              echo "❌ UPDATE NO rechazado."
              exit 1
            fi
            if psql "$DSN" -c "insert into public.branches(code,name) values('HACK','HACK');" 2>&1 | grep -q "permission denied"; then
              echo "✅ INSERT rechazado con permission denied."
            else
              echo "❌ INSERT NO rechazado."
              exit 1
            fi
          } > "$OUT"
          cat "$OUT"

      - name: Commit reports to main
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          git config user.name "HemoCura Sprint 0 bot"
          git config user.email "noreply@anthropic.com"
          git add docs/sprint-0/
          if git diff --staged --quiet; then
            echo "Sin cambios en los reports."
            exit 0
          fi
          git commit -m "chore(sprint-0): doctor + preflight reports ${STAMP}"
          git push origin HEAD:main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-0-reports
          path: docs/sprint-0/
          retention-days: 90
