name: HemoCura Training Safety

on:
  pull_request:
    paths:
      - 'training.html'
      - 'hemocura-core/training-app.js'
      - 'hemocura-core/training-enhancements.js'
      - 'hemocura-core/training-observability.js'
      - 'hemocura-core/competencies.js'
      - 'hemocura-core/router.js'
      - 'hemocura-core/management-data.js'
      - 'hemocura-core/management-review.js'
      - 'supabase/functions/training-tutor/**'
      - 'sql/migrations/*training*'
      - '.github/workflows/training-safety.yml'
  workflow_dispatch:

jobs:
  validate-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check hemocura-core/training-app.js
          node --check hemocura-core/training-enhancements.js
          node --check hemocura-core/training-observability.js
          node --check hemocura-core/competencies.js
          node --check hemocura-core/management-data.js
          node --check hemocura-core/management-review.js
      - name: HTML module links
        run: |
          grep -F './hemocura-core/training-app.js' training.html
          grep -F './hemocura-core/training-enhancements.js' training.html
          grep -F './hemocura-core/training-observability.js' training.html
      - name: Clinical guardrails
        run: |
          grep -F 'elegibilidad del donante' hemocura-core/training-app.js
          grep -F 'compatibilidad transfusional' hemocura-core/training-app.js
          grep -F 'liberación de componentes' hemocura-core/training-app.js
          ! grep -Eiq 'SUPABASE_SERVICE_ROLE|service_role[[:space:]]*[:=]' training.html hemocura-core/training-app.js hemocura-core/training-enhancements.js hemocura-core/training-observability.js
      - name: Certification controls
        run: |
          grep -F 'uid===session.user.id' hemocura-core/training-app.js
          grep -F "['ADMIN','CALIDAD','GERENCIA_OPERATIVA']" hemocura-core/training-app.js
          grep -F 'training_practical_evidence' hemocura-core/training-app.js
          grep -F 'training_certificates' hemocura-core/training-app.js
          grep -F 'training_authorizations' hemocura-core/training-app.js
      - name: Migration security controls
        run: |
          grep -F 'enable row level security' sql/migrations/20261010203726_training_release_1_0_foundation.sql
          grep -F 'security_invoker = true' sql/migrations/20261010203726_training_release_1_0_foundation.sql
          grep -F "set search_path = ''" sql/migrations/20261010203726_training_release_1_0_foundation.sql
          ! grep -Eiq 'GRANT[[:space:]]+ALL|DISABLE[[:space:]]+ROW[[:space:]]+LEVEL[[:space:]]+SECURITY' sql/migrations/20261010203726_training_release_1_0_foundation.sql sql/migrations/20261010203854_training_recertification_and_management_inputs.sql sql/migrations/20261010205123_training_assignment_document_and_bi_controls.sql sql/migrations/20261010205336_training_duration_and_module_performance.sql
      - name: Assignment and document approval gates
        run: |
          grep -F 'enforce_training_certificate_assignment' sql/migrations/20261010205123_training_assignment_document_and_bi_controls.sql
          grep -F 'enforce_training_content_approval' sql/migrations/20261010205123_training_assignment_document_and_bi_controls.sql
          grep -F 'HC-TRN-SUITE-001' sql/migrations/20261010205123_training_assignment_document_and_bi_controls.sql
      - name: UAT training cases are versioned
        run: |
          grep -F 'UAT-TRN-AO-001' sql/migrations/20261010203726_training_release_1_0_foundation.sql
          grep -F 'UAT-TRN-LAB-001' sql/migrations/20261010203726_training_release_1_0_foundation.sql
          grep -F 'UAT-TRN-ADM-001' sql/migrations/20261010203726_training_release_1_0_foundation.sql
