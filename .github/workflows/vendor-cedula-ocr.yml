name: Vendor fixed local cedula OCR assets
on:
  push:
    branches: [ops/cedula-ocr-assets]
    paths: ['.github/workflows/vendor-cedula-ocr.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/cedula-ocr-assets
      - name: Download public pinned OCR assets and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/vendor/ocr/core js/vendor/ocr/lang
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-lstm.wasm.js' --output js/vendor/ocr/core/tesseract-core-lstm.wasm.js
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0/tesseract-core-simd-lstm.wasm.js' --output js/vendor/ocr/core/tesseract-core-simd-lstm.wasm.js
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int/spa.traineddata.gz' --output js/vendor/ocr/lang/spa.traineddata.gz
          sha256sum --check <<'HASHES'
          775a35df6f2ae100e02609443e6bd5cafcd07983dd6175454ca4a432a7730687  js/vendor/ocr/core/tesseract-core-lstm.wasm.js
          9d7c43fb206dc9f48475228b46bf35f888fa9e6259da2e67d5a75c77049f2dc7  js/vendor/ocr/core/tesseract-core-simd-lstm.wasm.js
          40be52f97b5d4eb7460073dc1f94cd546b27150333c0bf854ed7e7132db6bceb  js/vendor/ocr/lang/spa.traineddata.gz
          HASHES
      - name: Commit only the three verified public assets
        shell: bash
        run: |
          set -euo pipefail
          git add -- js/vendor/ocr/core/tesseract-core-lstm.wasm.js js/vendor/ocr/core/tesseract-core-simd-lstm.wasm.js js/vendor/ocr/lang/spa.traineddata.gz
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor verified public OCR runtime and Spanish language data'
          git push origin HEAD:ops/cedula-ocr-assets

