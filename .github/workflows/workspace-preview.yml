name: Superuser workspace preview
on:
  pull_request:
    paths: ['hemocura-core/users.js', 'hemocura-core/users-data.js', 'hemocura-core/user-workspace-preview.js', 'hemocura-core/workspace-preview-model.js', 'hemocura-core/my-work.js', 'hemocura-core/access-control.js', 'hemocura-core/router.js', 'css/workspace-preview.css', 'tests/workspace-preview/**', 'tools/workspace_preview_browser_runner.cjs', '.github/workflows/workspace-preview.yml']
  push:
    branches: [main]
    paths: ['hemocura-core/users.js', 'hemocura-core/users-data.js', 'hemocura-core/user-workspace-preview.js', 'hemocura-core/workspace-preview-model.js', 'hemocura-core/my-work.js', 'hemocura-core/access-control.js', 'hemocura-core/router.js', 'css/workspace-preview.css', 'tests/workspace-preview/**', 'tools/workspace_preview_browser_runner.cjs', '.github/workflows/workspace-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/workspace-preview/domain.test.mjs
      - run: npm ci --prefix tests/wave50 --ignore-scripts --no-audit --no-fund
      - run: node tests/wave50/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - run: node tools/workspace_preview_browser_runner.cjs
        env:
          HEMOCURA_BROWSER_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-preview-${{ matrix.engine }}
          path: /tmp/hemocura-workspace-preview
