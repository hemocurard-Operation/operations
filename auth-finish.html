<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>HemoCura — Activar acceso</title><link rel="stylesheet" href="./css/app.css"></head>
<body><main class="login-shell"><section class="login-card"><div class="brand-mark">H</div><h1>Bienvenido a HemoCura</h1><p>Define tu clave para completar el acceso.</p><div id="activation-status" class="status info" role="status">Validando enlace…</div><form id="activation-form" hidden><label>Nueva clave<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Confirmar clave<input name="confirmation" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button type="submit">Guardar clave y entrar</button></form><p><a href="./login.html">Volver al inicio de sesión</a></p></section></main><script type="module" src="./js/auth-finish.js"></script></body></html>
