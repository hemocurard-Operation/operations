<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tiothqiljipdamgudvcb.supabase.co wss://tiothqiljipdamgudvcb.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="referrer" content="same-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HemoCura — Acceso</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-mark">H</div>
      <h1>HemoCura</h1>
      <p class="muted">Sistema de Gerencia de Operaciones</p>
      <div id="login-status" class="status info">Preparando autenticación…</div>
      <form id="login-form">
        <label>Usuario o correo de acceso<input id="email" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <p class="muted">Si comparte correo de contacto, ingrese con su usuario personal.</p>
        <label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label>
        <button id="login-button" type="submit">Entrar</button>
      </form>
      <button id="logout-button" type="button" class="secondary hidden">Cerrar sesión</button>
      <details class="debug-panel">
        <summary>Diagnóstico</summary>
        <pre id="debug-output">Sin eventos todavía.</pre>
      </details>
    </section>
  </main>
  <script type="module" src="./js/login.js"></script>
<p class="muted" style="text-align:center"><a href="./privacy.html">Privacidad y datos</a> · <a href="./uso-interno.html">Uso interno</a></p></body>
</html>
