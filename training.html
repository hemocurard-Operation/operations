<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HemoCura · Capacitación y Competencias</title>
<style>
:root{--navy:#1A365D;--red:#8B0000;--bg:#f5f7fb;--paper:#fff;--text:#172131;--muted:#667085;--line:#d9e0ea;--ok:#23703B;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}button,input,select,textarea{font:inherit}
.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--navy);color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:9px;align-items:center;border-bottom:1px solid #ffffff28;padding-bottom:15px}.mark{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800}.side button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:9px 10px;border-radius:8px;margin:2px 0;cursor:pointer}.side button.active,.side button:hover{background:#ffffff20}.main{min-width:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center}.content{max-width:1180px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.hero{background:linear-gradient(135deg,var(--navy),#294f80);color:#fff;border-radius:16px;padding:24px;margin-bottom:15px}.hero h1{margin:0 0 7px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#e8eef7;color:var(--navy)}.ok{background:#e5f3e8;color:var(--ok)}.warn{background:#fff4d9;color:var(--warn)}.bad{background:#f9e3e3;color:var(--red)}.notice{padding:11px 13px;border-radius:9px;margin:10px 0;background:#e8eef7;color:var(--navy)}.notice.ok{background:#e5f3e8;color:var(--ok)}.notice.warn{background:#fff4d9;color:#805800}.notice.bad{background:#f9e3e3;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:10px;padding:12px}.metric strong{font-size:25px;color:var(--navy)}.muted,.small{color:var(--muted);font-size:12px}.check{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.check input{width:18px;height:18px}.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f7;color:var(--text)}.btn.red{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.form label{font-size:12px;color:var(--muted)}.form input,.form select,.form textarea,textarea{width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:8px;background:#fff;color:var(--text);margin-top:4px}.quiz{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.option{display:flex;gap:8px;padding:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f9fc;color:var(--navy)}.hidden{display:none!important}.mock{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:260px}.mock-side{background:var(--navy);color:#fff;padding:12px;font-size:11px}.mock-side div{padding:6px;border-radius:6px}.mock-side .on{background:#ffffff20}.mock-main{padding:12px}.mock-box{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;background:#fff}.qr{display:grid;place-items:center;min-height:180px}.menu{display:none}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:260px;z-index:20;transition:.2s}.side.open{left:0}.menu{display:inline-block}.grid{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid,.metric-grid,.form{grid-template-columns:1fr}.content{padding:12px}.mock{grid-template-columns:1fr}.mock-side{display:none}}
@media print{.side,.top,.noprint{display:none!important}.shell{display:block}.content{padding:0}.section:not(#certificate){display:none!important}body{background:#fff}}
</style>
</head>
<body><div id="app"></div><script type="module" src="./hemocura-core/training-app.js"></script><script type="module" src="./hemocura-core/training-enhancements.js"></script><script type="module" src="./hemocura-core/training-observability.js"></script></body></html>
